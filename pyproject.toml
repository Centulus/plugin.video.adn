[project]
name = "plugin-video-adn"
version = "0.1.0"
description = "Dev environment and test suite for plugin.video.adn"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "kodistubs>=21.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "python-dotenv>=1.0.0",
    "requests-mock>=1.11.0",
    "requests>=2.31.0",
]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py38"
line-length = 120
extend-exclude = ["resources/lib/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ARG"]

[tool.pyright]
# The bundled libraries import each other by top-level name (see resources/lib/vendor/__init__.py).
extraPaths = ["resources/lib/vendor"]
